<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sweat Slots</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); }
  #overlay { pointer-events: none; }

  /* ---------- Slot screen ---------- */
  #slotScreen { position: absolute; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 22%, #3a1c4a, #000); }
  #slotScreen h1 { font-size: 30px; margin: 0; }

  .cabinet { display: flex; gap: 10px; padding: 16px; border-radius: 20px;
    background: linear-gradient(#2a2130, #171018);
    box-shadow: 0 0 0 4px #f5c542, 0 16px 40px rgba(0,0,0,.6); position: relative; }
  .reel { width: 84px; height: 88px; overflow: hidden; border-radius: 12px;
    background: #0e0e13; box-shadow: inset 0 8px 12px rgba(0,0,0,.8), inset 0 -8px 12px rgba(0,0,0,.8); }
  .strip { display: flex; flex-direction: column; will-change: transform; }
  .sym { height: 88px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
  .payline { position: absolute; left: 6px; right: 6px; top: 50%; height: 88px;
    transform: translateY(-50%); border: 2px solid rgba(245,197,66,.9); border-radius: 12px;
    pointer-events: none; }

  .bigbtn { padding: 16px 46px; font-size: 20px; font-weight: 800; border: 0;
    border-radius: 16px; background: #f5c542; color: #000; }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn:disabled { opacity: .5; }
  .ghost { background: rgba(255,255,255,.16); color: #fff; padding: 12px 26px;
    font-size: 15px; font-weight: 700; border: 0; border-radius: 14px; }
  #result { display: none; flex-direction: column; align-items: center; gap: 16px; }
  #resultText { font-size: 24px; font-weight: 800; line-height: 1.4; }
  .row { display: flex; gap: 12px; }
  .hint { font-size: 13px; opacity: .5; max-width: 300px; line-height: 1.5; }

  /* ---------- Counter ---------- */
  #counter { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); pointer-events: none; display: none; }
  .set { font-size: 4.5vw; opacity: .8; margin-bottom: 1vh; letter-spacing: .5px; }
  .reps { font-size: 22vw; font-weight: 800; line-height: 1; }
  .label { font-size: 6vw; opacity: .9; margin-top: 1vh; }
  .angle { font-size: 4vw; opacity: .55; margin-top: 1vh; font-variant-numeric: tabular-nums; }
  #closeBtn { position: absolute; top: 14px; left: 14px; z-index: 6; display: none;
    width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 20px;
    background: rgba(0,0,0,.4); color: #fff; backdrop-filter: blur(6px); }

  /* ---------- Overlays ---------- */
  .cover { position: absolute; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,.85); text-align: center; padding: 28px; }
  .cover h1 { font-size: 34px; margin: 0; }
  .cover p { font-size: 20px; opacity: .85; margin: 0; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <button id="closeBtn">✕</button>
  <div class="counter" id="counter">
    <div class="set" id="setLabel"></div>
    <div class="reps" id="reps">0</div>
    <div class="label" id="goalLabel"></div>
    <div class="angle" id="angle"></div>
  </div>

  <div id="slotScreen">
    <h1>🎰 Sweat Slots</h1>
    <div class="cabinet">
      <div class="reel"><div class="strip" id="reel0"></div></div>
      <div class="reel"><div class="strip" id="reel1"></div></div>
      <div class="reel"><div class="strip" id="reel2"></div></div>
      <div class="payline"></div>
    </div>
    <button class="bigbtn" id="spinBtn">PULL 🎲</button>
    <div id="result">
      <div id="resultText"></div>
      <div class="row">
        <button class="bigbtn" id="startBtn">Let's go</button>
        <button class="ghost" id="respinBtn">Pull again</button>
      </div>
    </div>
    <div class="hint">Three reels = a mini circuit. Match all three for the jackpot.
      The camera counts your reps — everything runs on your phone.</div>
  </div>

  <div class="cover" id="next">
    <p id="nextText"></p>
    <button class="bigbtn" id="continueBtn">Continue</button>
  </div>

  <div class="cover" id="done">
    <h1>✅ Circuit complete!</h1>
    <button class="bigbtn" id="againBtn">Pull again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
// ---------- Exercise rules (angle at a joint defines a rep) ----------
const EXERCISES = {
  squat:  { name: 'Squats',    emoji: '🦵',
            sides: [['left_hip','left_knee','left_ankle'], ['right_hip','right_knee','right_ankle']],
            flexed: 100, extended: 160, minSec: 0.8 },
  pushup: { name: 'Push-ups',  emoji: '💪',
            sides: [['left_shoulder','left_elbow','left_wrist'], ['right_shoulder','right_elbow','right_wrist']],
            flexed: 95,  extended: 150, minSec: 0.7 },
  situp:  { name: 'Sit-ups',   emoji: '🔥',
            sides: [['left_shoulder','left_hip','left_knee'], ['right_shoulder','right_hip','right_knee']],
            flexed: 95,  extended: 150, minSec: 0.7 },
};
const EX_ORDER = ['squat', 'pushup', 'situp'];
const REP_CHOICES = [5, 10, 15];
const JACKPOT_REPS = 30;

// ---------- Build the 3 reels ----------
const SYMH = 88;   // must match .reel / .sym height in CSS
const LOOPS = 14;  // symbol repeats per reel strip
const reels = [document.getElementById('reel0'),
               document.getElementById('reel1'),
               document.getElementById('reel2')];
reels.forEach(strip => {
  for (let k = 0; k < LOOPS * 3; k++) {
    const d = document.createElement('div');
    d.className = 'sym';
    d.textContent = EXERCISES[EX_ORDER[k % 3]].emoji;
    strip.appendChild(d);
  }
  strip.style.transform = 'translateY(0)';
});

// ---------- Spin logic ----------
const spinBtn = document.getElementById('spinBtn');
const resultBox = document.getElementById('result');
const resultText = document.getElementById('resultText');
let spinning = false;
let queue = [];   // [{ ex, reps }] stations for this pull

spinBtn.onclick = () => {
  if (spinning) return;
  spinning = true;
  spinBtn.style.display = 'none';
  resultBox.style.display = 'none';

  const idx = [rand3(), rand3(), rand3()];               // exercise index per reel
  reels.forEach((strip, i) => {
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;                             // force reflow so the reset takes
    const p = ((LOOPS - 3) - i) * 3 + idx[i];           // land payline on idx[i]
    strip.style.transition = `transform ${1.8 + i * 0.6}s cubic-bezier(.12,.62,.2,1)`;
    strip.style.transform = `translateY(${-p * SYMH}px)`;
  });

  reels[2].addEventListener('transitionend', function reveal() {
    reels[2].removeEventListener('transitionend', reveal);
    finishSpin(idx);
  }, { once: true });
};

function rand3() { return Math.floor(Math.random() * 3); }
function pickReps() { return REP_CHOICES[Math.floor(Math.random() * REP_CHOICES.length)]; }

function finishSpin(idx) {
  const jackpot = idx[0] === idx[1] && idx[1] === idx[2];
  if (jackpot) {
    const ex = EX_ORDER[idx[0]];
    queue = [{ ex, reps: JACKPOT_REPS }];
    resultText.innerHTML = `🎰 JACKPOT!<br>${JACKPOT_REPS} ${EXERCISES[ex].name} ${EXERCISES[ex].emoji}`;
  } else {
    queue = idx.map(t => ({ ex: EX_ORDER[t], reps: pickReps() }));
    resultText.innerHTML = 'Your circuit:<br>' +
      queue.map(s => `${s.reps} ${EXERCISES[s.ex].emoji}`).join(' &nbsp;·&nbsp; ');
  }
  resultBox.style.display = 'flex';
  spinning = false;
}

document.getElementById('respinBtn').onclick = () => {
  resultBox.style.display = 'none';
  spinBtn.style.display = 'block';
};
document.getElementById('startBtn').onclick = startCircuit;
document.getElementById('continueBtn').onclick = () => {
  document.getElementById('next').style.display = 'none';
  startStation();
};
document.getElementById('againBtn').onclick = backToSlots;
document.getElementById('closeBtn').onclick = backToSlots;

// ---------- Camera + pose ----------
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
let detector = null, started = false, active = false;
let stationIdx = 0, exercise, goal, reps, phase, flexedAt;

async function startCircuit() {
  stationIdx = 0;
  document.getElementById('slotScreen').style.display = 'none';

  if (!started) {
    const btn = document.getElementById('startBtn');
    btn.textContent = 'Loading…'; btn.disabled = true;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
    started = true;
    btn.textContent = "Let's go"; btn.disabled = false;
    loop();
  }
  startStation();
}

function startStation() {
  const s = queue[stationIdx];
  exercise = EXERCISES[s.ex];
  goal = s.reps;
  reps = 0; phase = 'extended';
  document.getElementById('reps').textContent = '0';
  document.getElementById('goalLabel').textContent = `/ ${goal} ${exercise.name}`;
  document.getElementById('setLabel').textContent =
    queue.length > 1 ? `Set ${stationIdx + 1} of ${queue.length}` : '';
  document.getElementById('counter').style.display = 'block';
  document.getElementById('closeBtn').style.display = 'block';
  active = true;
}

function backToSlots() {
  active = false;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  document.getElementById('counter').style.display = 'none';
  document.getElementById('closeBtn').style.display = 'none';
  document.getElementById('next').style.display = 'none';
  document.getElementById('done').style.display = 'none';
  resultBox.style.display = 'none';
  spinBtn.style.display = 'block';
  document.getElementById('slotScreen').style.display = 'flex';
}

async function loop() {
  const poses = await detector.estimatePoses(video, { flipHorizontal: false });
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (active && poses[0]) {
    const kp = {};
    poses[0].keypoints.forEach(p => { if (p.score > 0.3) kp[p.name] = p; });
    drawSkeleton(kp);
    updateReps(kp);
  }
  requestAnimationFrame(loop);
}

function angleAt(a, b, c) {
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const m1 = Math.hypot(v1x, v1y), m2 = Math.hypot(v2x, v2y);
  if (!m1 || !m2) return null;
  const cos = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (m1 * m2)));
  return Math.acos(cos) * 180 / Math.PI;
}

function updateReps(kp) {
  const vals = [];
  for (const [a, b, c] of exercise.sides) {
    if (kp[a] && kp[b] && kp[c]) { const d = angleAt(kp[a], kp[b], kp[c]); if (d != null) vals.push(d); }
  }
  const angleEl = document.getElementById('angle');
  if (!vals.length) { angleEl.textContent = 'get your whole body in frame'; return; }
  const deg = vals.reduce((s, v) => s + v, 0) / vals.length;
  angleEl.textContent = Math.round(deg) + '°';

  const now = performance.now() / 1000;
  if (phase === 'extended' && deg < exercise.flexed) { phase = 'flexed'; flexedAt = now; }
  else if (phase === 'flexed' && deg > exercise.extended) {
    phase = 'extended';
    if (now - flexedAt >= exercise.minSec) countRep();
  }
}

function countRep() {
  reps++;
  const el = document.getElementById('reps');
  el.textContent = reps;
  el.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 250 });
  if (navigator.vibrate) navigator.vibrate(40);
  if (reps >= goal) finishStation();
}

function finishStation() {
  active = false;
  if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  document.getElementById('counter').style.display = 'none';
  document.getElementById('closeBtn').style.display = 'none';

  stationIdx++;
  if (stationIdx < queue.length) {
    const s = queue[stationIdx];
    document.getElementById('nextText').innerHTML =
      `Next up:<br>${s.reps} ${EXERCISES[s.ex].name} ${EXERCISES[s.ex].emoji}`;
    document.getElementById('next').style.display = 'flex';
  } else {
    document.getElementById('done').style.display = 'flex';
  }
}

const BONES = [
  ['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],
  ['right_shoulder','right_elbow'],['right_elbow','right_wrist'],
  ['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],
  ['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle'],
];
function drawSkeleton(kp) {
  octx.strokeStyle = '#34c759'; octx.lineWidth = 6; octx.lineCap = 'round';
  for (const [a, b] of BONES) if (kp[a] && kp[b]) {
    octx.beginPath(); octx.moveTo(kp[a].x, kp[a].y); octx.lineTo(kp[b].x, kp[b].y); octx.stroke();
  }
  octx.fillStyle = '#fff';
  for (const n in kp) { octx.beginPath(); octx.arc(kp[n].x, kp[n].y, 5, 0, Math.PI * 2); octx.fill(); }
}
</script>
</body>
</html>
