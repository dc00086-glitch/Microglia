<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin & Sweat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); }
  #overlay { pointer-events: none; }

  /* ---------- Wheel screen ---------- */
  #wheelScreen { position: absolute; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 25%, #1c2b4a, #000); }
  #wheelScreen h1 { font-size: 30px; margin: 0; }
  .wheelWrap { position: relative; width: min(82vw, 340px); aspect-ratio: 1; }
  #wheel { width: 100%; height: 100%; border-radius: 50%;
    box-shadow: 0 0 0 6px rgba(255,255,255,.12), 0 14px 40px rgba(0,0,0,.6);
    transition: transform 4.2s cubic-bezier(.15,.85,.25,1); }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 26px solid #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); z-index: 2; }
  .hub { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px;
    transform: translate(-50%,-50%); background: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px; }

  .bigbtn { padding: 16px 46px; font-size: 20px; font-weight: 800; border: 0;
    border-radius: 16px; background: #34c759; color: #000; }
  .bigbtn:active { transform: scale(.97); }
  .ghost { background: rgba(255,255,255,.16); color: #fff; padding: 12px 26px;
    font-size: 15px; font-weight: 700; border: 0; border-radius: 14px; }
  #result { display: none; flex-direction: column; align-items: center; gap: 16px; }
  #resultText { font-size: 26px; font-weight: 800; }
  .row { display: flex; gap: 12px; }
  .hint { font-size: 13px; opacity: .5; max-width: 300px; line-height: 1.5; }

  /* ---------- Counter ---------- */
  #counter { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); pointer-events: none; display: none; }
  .reps { font-size: 22vw; font-weight: 800; line-height: 1; }
  .label { font-size: 6vw; opacity: .9; margin-top: 1vh; }
  .angle { font-size: 4vw; opacity: .55; margin-top: 1vh; font-variant-numeric: tabular-nums; }
  #closeBtn { position: absolute; top: 14px; left: 14px; z-index: 6; display: none;
    width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 20px;
    background: rgba(0,0,0,.4); color: #fff; backdrop-filter: blur(6px); }

  /* ---------- Done ---------- */
  #done { position: absolute; inset: 0; display: none; z-index: 20;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,.85); text-align: center; padding: 28px; }
  #done h1 { font-size: 38px; margin: 0; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <button id="closeBtn">✕</button>
  <div class="counter" id="counter">
    <div class="reps" id="reps">0</div>
    <div class="label" id="goalLabel"></div>
    <div class="angle" id="angle"></div>
  </div>

  <div id="wheelScreen">
    <h1>🎰 Spin &amp; Sweat</h1>
    <div class="wheelWrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="360" height="360"></canvas>
      <div class="hub">🎯</div>
    </div>
    <button class="bigbtn" id="spinBtn">SPIN</button>
    <div id="result">
      <div id="resultText"></div>
      <div class="row">
        <button class="bigbtn" id="startBtn">Let's go</button>
        <button class="ghost" id="respinBtn">Spin again</button>
      </div>
    </div>
    <div class="hint">The wheel picks your exercise and reps. Camera counts them —
      everything runs on your phone, nothing is recorded.</div>
  </div>

  <div id="done">
    <h1>✅ Crushed it!</h1>
    <button class="bigbtn" id="againBtn">Spin again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
// ---------- Exercise rules (angle at a joint defines a rep) ----------
const EXERCISES = {
  squat:  { name: 'Squats',    emoji: '🦵',
            sides: [['left_hip','left_knee','left_ankle'], ['right_hip','right_knee','right_ankle']],
            flexed: 100, extended: 160, minSec: 0.8 },
  pushup: { name: 'Push-ups',  emoji: '💪',
            sides: [['left_shoulder','left_elbow','left_wrist'], ['right_shoulder','right_elbow','right_wrist']],
            flexed: 95,  extended: 150, minSec: 0.7 },
  situp:  { name: 'Sit-ups',   emoji: '🔥',
            sides: [['left_shoulder','left_hip','left_knee'], ['right_shoulder','right_hip','right_knee']],
            flexed: 95,  extended: 150, minSec: 0.7 },
};

// ---------- Wheel segments (exercise + rep combos) ----------
const SEG = [
  { ex: 'squat',  reps: 5  }, { ex: 'pushup', reps: 10 }, { ex: 'situp',  reps: 15 },
  { ex: 'squat',  reps: 20 }, { ex: 'pushup', reps: 5  }, { ex: 'situp',  reps: 10 },
  { ex: 'squat',  reps: 15 }, { ex: 'pushup', reps: 15 }, { ex: 'situp',  reps: 5  },
  { ex: 'squat',  reps: 10 },
];
const COLORS = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6',
                '#ec4899','#14b8a6','#f97316','#6366f1','#22c55e'];
const N = SEG.length;
const segDeg = 360 / N;

// ---------- Wheel drawing & spin ----------
const wheel = document.getElementById('wheel');
const wctx = wheel.getContext('2d');
let rotation = 0;
let chosen = null;

function drawWheel() {
  const size = wheel.width, r = size / 2;
  wctx.clearRect(0, 0, size, size);
  for (let i = 0; i < N; i++) {
    const start = (-90 - segDeg / 2 + i * segDeg) * Math.PI / 180;
    const end = start + segDeg * Math.PI / 180;
    wctx.beginPath();
    wctx.moveTo(r, r);
    wctx.arc(r, r, r - 3, start, end);
    wctx.closePath();
    wctx.fillStyle = COLORS[i % COLORS.length];
    wctx.fill();

    wctx.save();
    wctx.translate(r, r);
    wctx.rotate((-90 + i * segDeg) * Math.PI / 180);
    wctx.textAlign = 'right';
    wctx.fillStyle = '#fff';
    wctx.font = 'bold 26px -apple-system, sans-serif';
    wctx.fillText(String(SEG[i].reps), r - 22, -4);
    wctx.font = '600 20px -apple-system, sans-serif';
    wctx.fillText(EXERCISES[SEG[i].ex].emoji, r - 24, 20);
    wctx.restore();
  }
}
drawWheel();

const spinBtn = document.getElementById('spinBtn');
const resultBox = document.getElementById('result');
const resultText = document.getElementById('resultText');
let spinning = false;

spinBtn.onclick = () => {
  if (spinning) return;
  spinning = true;
  spinBtn.style.display = 'none';
  resultBox.style.display = 'none';

  const i = Math.floor(Math.random() * N);
  const desiredMod = (360 - i * segDeg) % 360;                 // rotation to land segment i at top
  const delta = 5 * 360 + (((desiredMod - (rotation % 360)) + 360) % 360);
  rotation += delta;
  wheel.style.transform = `rotate(${rotation}deg)`;

  wheel.addEventListener('transitionend', function reveal() {
    wheel.removeEventListener('transitionend', reveal);
    chosen = SEG[i];
    resultText.textContent = `${chosen.reps} ${EXERCISES[chosen.ex].name} ${EXERCISES[chosen.ex].emoji}`;
    resultBox.style.display = 'flex';
    spinning = false;
  }, { once: true });
};

document.getElementById('respinBtn').onclick = () => {
  resultBox.style.display = 'none';
  spinBtn.style.display = 'block';
};
document.getElementById('startBtn').onclick = beginWorkout;
document.getElementById('againBtn').onclick = backToWheel;
document.getElementById('closeBtn').onclick = backToWheel;

// ---------- Camera + pose ----------
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
let detector = null, started = false, active = false;
let exercise, goal, reps, phase, flexedAt;

async function beginWorkout() {
  exercise = EXERCISES[chosen.ex];
  goal = chosen.reps;
  reps = 0; phase = 'extended';

  document.getElementById('wheelScreen').style.display = 'none';
  document.getElementById('counter').style.display = 'block';
  document.getElementById('closeBtn').style.display = 'block';
  document.getElementById('reps').textContent = '0';
  document.getElementById('goalLabel').textContent = `/ ${goal} ${exercise.name}`;

  if (!started) {
    startBtnBusy(true);
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING });
    started = true;
    startBtnBusy(false);
    loop();
  }
  active = true;
}

function startBtnBusy(b) {
  const btn = document.getElementById('startBtn');
  btn.textContent = b ? 'Loading…' : "Let's go";
  btn.disabled = b;
}

function backToWheel() {
  active = false;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  document.getElementById('counter').style.display = 'none';
  document.getElementById('closeBtn').style.display = 'none';
  document.getElementById('done').style.display = 'none';
  resultBox.style.display = 'none';
  spinBtn.style.display = 'block';
  document.getElementById('wheelScreen').style.display = 'flex';
}

async function loop() {
  const poses = await detector.estimatePoses(video, { flipHorizontal: false });
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (active && poses[0]) {
    const kp = {};
    poses[0].keypoints.forEach(p => { if (p.score > 0.3) kp[p.name] = p; });
    drawSkeleton(kp);
    updateReps(kp);
  }
  requestAnimationFrame(loop);
}

function angle(a, b, c) {
  const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
  const m1 = Math.hypot(v1x, v1y), m2 = Math.hypot(v2x, v2y);
  if (!m1 || !m2) return null;
  const cos = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (m1 * m2)));
  return Math.acos(cos) * 180 / Math.PI;
}

function updateReps(kp) {
  const vals = [];
  for (const [a, b, c] of exercise.sides) {
    if (kp[a] && kp[b] && kp[c]) { const d = angle(kp[a], kp[b], kp[c]); if (d != null) vals.push(d); }
  }
  const angleEl = document.getElementById('angle');
  if (!vals.length) { angleEl.textContent = 'get your whole body in frame'; return; }
  const deg = vals.reduce((s, v) => s + v, 0) / vals.length;
  angleEl.textContent = Math.round(deg) + '°';

  const now = performance.now() / 1000;
  if (phase === 'extended' && deg < exercise.flexed) { phase = 'flexed'; flexedAt = now; }
  else if (phase === 'flexed' && deg > exercise.extended) {
    phase = 'extended';
    if (now - flexedAt >= exercise.minSec) countRep();
  }
}

function countRep() {
  reps++;
  const el = document.getElementById('reps');
  el.textContent = reps;
  el.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 250 });
  if (navigator.vibrate) navigator.vibrate(40);
  if (reps >= goal) finish();
}

function finish() {
  active = false;
  if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  document.getElementById('counter').style.display = 'none';
  document.getElementById('closeBtn').style.display = 'none';
  document.getElementById('done').style.display = 'flex';
}

const BONES = [
  ['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],
  ['right_shoulder','right_elbow'],['right_elbow','right_wrist'],
  ['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],
  ['left_hip','left_knee'],['left_knee','left_ankle'],['right_hip','right_knee'],['right_knee','right_ankle'],
];
function drawSkeleton(kp) {
  octx.strokeStyle = '#34c759'; octx.lineWidth = 6; octx.lineCap = 'round';
  for (const [a, b] of BONES) if (kp[a] && kp[b]) {
    octx.beginPath(); octx.moveTo(kp[a].x, kp[a].y); octx.lineTo(kp[b].x, kp[b].y); octx.stroke();
  }
  octx.fillStyle = '#fff';
  for (const n in kp) { octx.beginPath(); octx.arc(kp[n].x, kp[n].y, 5, 0, Math.PI * 2); octx.fill(); }
}
</script>
</body>
</html>
